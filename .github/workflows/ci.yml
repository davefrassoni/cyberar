name: Verify CYBER.AR
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyberar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cyberar
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgresql://cyberar:ci-only-password@localhost:5432/cyberar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test tests -v 2
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
